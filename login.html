<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - Pomodoro Clock</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <p>pomodoro</p>
    </main>

    <dialog id="login-modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="login-title">Đăng nhập</h2>
          <button type="button" id="close-login" aria-label="Đóng">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"><path fill="#1E213F" fill-rule="evenodd" d="M11.95.636l1.414 1.414L8.414 7l4.95 4.95-1.414 1.414L7 8.414l-4.95 4.95L.636 11.95 5.586 7 .636 2.05 2.05.636 7 5.586l4.95-4.95z" opacity=".5" /></svg>
          </button>
        </div>

        <form id="login-form">
          <div class="auth-inputs">
            <input type="text" id="login-username" placeholder="Tên đăng nhập" autocomplete="username" required />
            <input type="password" id="login-password" placeholder="Mật khẩu" autocomplete="current-password" required />
          </div>
          <p id="login-error" class="login-error"></p>
          <button type="submit" id="login-submit" class="auth-submit" data-mode="login">Đăng nhập</button>
          <button type="button" id="toggle-register" class="auth-link">Chưa có tài khoản? Tạo tài khoản mới</button>
        </form>
      </div>
    </dialog>

    <script type="module" src="./js/login.js"></script>
  </body>
</html>
