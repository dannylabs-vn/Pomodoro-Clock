<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pomodoro Clock</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght,YOPQ@100..900,300&family=Roboto+Slab:wght@100..900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <main class="container">
      <p>pomodoro</p>

      <div id="but">
        <button id="str">pomodoro</button>
        <button id="short">Short break</button>
        <button id="long">Long break</button>
      </div>

      <div id="timer">
        <div class="vong-de"></div>
        <div class="vong-do">
          <svg viewBox="0 0 100 100">
            <circle class="progress" cx="50" cy="50" r="47" fill="none" stroke="#F87070" stroke-width="4" stroke-linecap="round" stroke-dasharray="295.3"></circle>
          </svg>
        </div>
        <div id="content-timer">
          <div id="time-display">25:00</div>
          <div id="displaytrangthai">START</div>
        </div>
      </div>

      <button id="open" aria-label="Mở cài đặt">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
          <path fill="#D7E0FF" d="M26.965 17.682l-2.927-2.317c.055-.448.097-.903.097-1.365 0-.462-.042-.917-.097-1.365l2.934-2.317a.702.702 0 00.167-.896l-2.775-4.851a.683.683 0 00-.847-.301l-3.454 1.407a11.43 11.43 0 00-2.345-1.379l-.52-3.71A.716.716 0 0016.503 0h-5.55a.703.703 0 00-.687.588l-.52 3.71c-.847.413-1.636.917-2.345 1.379L3.947 4.27a.69.69 0 00-.847.301L.325 9.422a.705.705 0 00.167.896l2.927 2.317c-.055.448-.097.903-.097 1.365 0 .462.042.917.097 1.365L.484 17.682a.702.702 0 00-.167.896L3.092 23.43a.683.683 0 00.847.301l3.454-1.407c.709.462 1.498.966 2.345 1.379l.52 3.71c.056.329.34.588.687.588h5.55a.703.703 0 00.687-.588l.52-3.71c.847-.413 1.636-.917 2.345-1.379l3.454 1.407a.69.69 0 00.847-.301l2.775-4.851a.705.705 0 00-.167-.896zM14 19.6a5.6 5.6 0 110-11.2 5.6 5.6 0 010 11.2z" />
        </svg>
      </button>

      <div id="auth-area">
        <button id="btn-pricing" class="top-btn pricing-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="1" />
            <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z" />
            <path d="M7 9h10M7 15h10" />
          </svg>
          VIP
        </button>
        <button id="btn-login" class="top-btn">Đăng nhập</button>
        <span id="user-info" class="user-info" hidden></span>
        <button id="btn-logout" class="top-btn" hidden>Đăng xuất</button>
      </div>
    </main>

    <dialog id="settings-modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Settings</h2>
          <button type="button" id="close-settings-btn" aria-label="Close settings">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"><path fill="#1E213F" fill-rule="evenodd" d="M11.95.636l1.414 1.414L8.414 7l4.95 4.95-1.414 1.414L7 8.414l-4.95 4.95L.636 11.95 5.586 7 .636 2.05 2.05.636 7 5.586l4.95-4.95z" opacity=".5" /></svg>
          </button>
        </div>

        <form id="settings-form">
          <div class="setting-section">
            <h3>TIME (MINUTES)</h3>
            <div class="time-inputs">
              <div class="input-group">
                <label for="pomodoro-time">pomodoro</label>
                <input type="number" id="pomodoro-time" min="1" max="90" value="25" />
              </div>
              <div class="input-group">
                <label for="short-time">short break</label>
                <input type="number" id="short-time" min="1" max="30" value="5" />
              </div>
              <div class="input-group">
                <label for="long-time">long break</label>
                <input type="number" id="long-time" min="1" max="60" value="15" />
              </div>
            </div>
          </div>

          <div class="setting-section horizontal-flex">
            <h3>FONT</h3>
            <div class="font-options">
              <button type="button" class="font-btn active" style="font-family: 'Kumbh Sans', sans-serif">Aa</button>
              <button type="button" class="font-btn" style="font-family: 'Roboto Slab', serif">Aa</button>
              <button type="button" class="font-btn" style="font-family: 'Space Mono', monospace">Aa</button>
            </div>
          </div>

          <div class="setting-section horizontal-flex no-border">
            <h3>COLOR</h3>
            <div class="color-options">
              <button type="button" class="color-btn active" style="background-color: #f87070">
                <svg width="15" height="11" viewBox="0 0 15 11" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 5.5L4.95263 9.45263L13.4053 1" stroke="#161932" stroke-width="2" /></svg>
              </button>
              <button type="button" class="color-btn" style="background-color: #e1f478"></button>
              <button type="button" class="color-btn" style="background-color: #d881f8"></button>
            </div>
          </div>

          <button type="submit" id="apply-btn">Apply</button>
        </form>
      </div>
    </dialog>

    <button id="btn-history" class="history-btn">Lịch sử</button>
    <button id="btn-todo" class="history-btn">Danh sách việc</button>

    <dialog id="history-modal">
      <div class="modal-content">
        <h2>Lịch sử các phiên</h2>
        <table id="history-table">
          <thead>
            <tr><th>Ngày</th><th>Giờ bắt đầu</th><th>Giờ kết thúc</th></tr>
          </thead>
          <tbody id="history-body"></tbody>
        </table>
        <button id="close-history">Đóng</button>
      </div>
    </dialog>

    <dialog id="todo-modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Danh sách việc (To-do)</h2>
          <button type="button" id="close-todo-btn" aria-label="Close todo">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"><path fill="#1E213F" fill-rule="evenodd" d="M11.95.636l1.414 1.414L8.414 7l4.95 4.95-1.414 1.414L7 8.414l-4.95 4.95L.636 11.95 5.586 7 .636 2.05 2.05.636 7 5.586l4.95-4.95z" opacity=".5" /></svg>
          </button>
        </div>

        <form id="todo-form" class="todo-form">
          <input type="text" id="todo-text" placeholder="Nhập việc cần làm..." maxlength="120" autocomplete="off" />
          <div class="todo-cycles">
            <label for="todo-cycles">Số vòng pomodoro</label>
            <input type="number" id="todo-cycles" min="1" max="20" value="4" />
          </div>
          <button type="submit" class="todo-add">Thêm</button>
        </form>

        <ul id="todo-list" class="todo-list"></ul>
      </div>
    </dialog>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
