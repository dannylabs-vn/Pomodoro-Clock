<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>History</title>
  </head>
  <body>
    <dialog id="history-modal">
      <div class="modal-content">
        <h2>Lịch sử các phiên</h2>
        <table id="history-table">
          <thead>
            <tr><th>Ngày</th><th>Giờ bắt đầu</th><th>Giờ kết thúc</th></tr>
          </thead>
          <tbody id="history-body"></tbody>
        </table>
        <button id="close-history">Đóng</button>
      </div>
    </dialog>
  </body>
</html>
